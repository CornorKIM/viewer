<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <title>TP_2-3_RealTime</title>
    <style>
      body { margin: 0; overflow: hidden; }
      canvas { display: block; }

      #info {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.6);
        color: white;
        padding: 10px 20px;
        border-radius: 8px;
        font-family: sans-serif;
        font-size: 14px;
        pointer-events: none;
      }

      /* 선택 화면 중심 좌표 HUD — 상단 가운데 한 줄 (2×2 제목 사이, 전체 화면 제목 아래) */
      #coords {
        position: fixed;
        top: 40px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.45);
        color: rgba(255,255,255,0.85);
        padding: 3px 10px;
        border-radius: 999px;
        font-family: monospace;
        font-size: 12px;
        white-space: pre;
        pointer-events: none;
        z-index: 5;
      }

      /* 설비 데이터 카드 — 화면(업체)별 우상단, 전체 화면은 4개사 비교표 */
      .machine-card {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(0,0,0,0.6);
        color: #ffffff;
        padding: 7px 11px;
        border-radius: 8px;
        font-family: sans-serif;
        font-size: 11px;
        line-height: 1.3;
        white-space: nowrap;
        pointer-events: none;
      }
      .machine-card .machine-head {
        font-weight: bold;
      }
      .machine-card .machine-sub {
        color: rgba(255,255,255,0.65);
      }
      .machine-card table {
        border-collapse: collapse;
      }
      .machine-card thead th {
        color: rgba(255,255,255,0.65);
        font-weight: normal;
        text-align: right;
        padding: 4px 0 1px 14px;
      }
      .machine-card thead th:first-child {
        text-align: left;
        padding-left: 0;
      }
      .machine-card .machine-group th {
        color: #ffd27a;
        font-weight: normal;
        text-align: left;
        padding: 5px 0 1px;
        border-bottom: 1px solid rgba(255,255,255,0.2);
      }
      .machine-card td {
        padding: 1px 0;
      }
      .machine-card td.num {
        color: #b9ff9e;
        font-family: monospace;
        text-align: right;
        padding: 1px 0 1px 14px;
      }

      /* 모델 앞 실시간 축 이동값 라벨 — 3D 위치를 화면에 투영(main.js updateCoordLabels) */
      .coord-label {
        position: absolute;
        transform: translate(-50%, -100%);
        background: rgba(12,16,22,0.82);
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 6px;
        padding: 4px 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.45);
        font-family: monospace;
        font-size: 13px;
        line-height: 1.35;
        color: #ffffff;
        white-space: nowrap;
        pointer-events: none;
      }
      .coord-label .coord-name {
        font-family: sans-serif;
        font-size: 11px;
        color: #ffd27a;
        margin-bottom: 1px;
      }
      .coord-label .coord-row {
        display: flex;
        gap: 6px;
      }
      .coord-label .coord-axis {
        font-weight: bold;
      }
      .coord-label .ax-x { color: #ff6b6b; }
      .coord-label .ax-y { color: #69db7c; }
      .coord-label .ax-z { color: #74c0fc; }
      .coord-label .coord-value {
        min-width: 9ch;
        text-align: right;
      }
      .coord-label .coord-unit {
        color: rgba(255,255,255,0.5);
        font-size: 11px;
      }

      #customerService {
        position: fixed;
        top: 10px;
        left: 10px;
        background: rgba(0,0,0,0.45);
        color: #ffd27a;
        padding: 4px 10px;
        border-radius: 6px;
        font-family: sans-serif;
        font-size: 12px;
        text-decoration: none;
        pointer-events: auto;
        cursor: pointer;
      }
      #customerService:hover {
        background: rgba(0,0,0,0.8);
      }

      /* 표시 on/off 토글 — 한 줄 작은 칩. 켜짐 = 노란 바탕, 꺼짐 = 흐린 글자 */
      #toggles {
        position: fixed;
        top: 40px;
        left: 10px;
        display: flex;
        gap: 4px;
        z-index: 10;
      }
      #toggles .toggle-row {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 8px;
        background: rgba(0,0,0,0.45);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 999px;
        color: rgba(255,255,255,0.55);
        font-family: sans-serif;
        font-size: 12px;
        line-height: 1.3;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }
      #toggles .toggle-row:hover {
        color: #ffffff;
        border-color: rgba(255,255,255,0.45);
      }
      #toggles .toggle-row.on {
        background: rgba(255,210,122,0.9);
        border-color: rgba(255,210,122,0.9);
        color: #1e1e1e;
      }
      #toggles kbd {
        font-family: monospace;
        font-size: 10px;
        opacity: 0.6;
      }
      .hidden {
        display: none !important;
      }

      /* 2×2 화면 구분선·제목 */
      #viewGrid {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        pointer-events: none;
      }
      .view-frame {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.25);
      }
      .view-frame.active {
        border: 2px solid #ffd27a;
      }
      .view-title {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.6);
        color: #ffffff;
        padding: 4px 12px;
        border-radius: 6px;
        font-family: sans-serif;
        font-size: 13px;
        white-space: nowrap;
      }
      #overviewFrame {
        position: fixed;
        inset: 0;
        border: none;
        pointer-events: none;
      }
      .view-frame.active .view-title {
        color: #ffd27a;
      }

      /* 핵심성과지표(KPI) 카드 — 화면 좌하단 */
      .kpi-card {
        position: absolute;
        left: 10px;
        bottom: 10px;
        background: rgba(0,0,0,0.6);
        color: #ffffff;
        padding: 8px 12px;
        border-radius: 8px;
        font-family: sans-serif;
        font-size: 12px;
        line-height: 1.4;
        white-space: nowrap;
      }
      #kpi-overview {
        left: 16px;
      }
      .kpi-head {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 4px;
        font-weight: bold;
      }
      .kpi-card table {
        border-collapse: collapse;
      }
      .kpi-card th {
        color: rgba(255,255,255,0.65);
        font-weight: normal;
        text-align: left;
        padding: 2px 6px 2px 0;
        border-bottom: 1px solid rgba(255,255,255,0.2);
      }
      .kpi-card td {
        padding: 2px 6px 2px 0;
      }
      .kpi-card th:not(:first-child),
      .kpi-card td.num {
        text-align: right;
        padding-left: 10px;
        font-variant-numeric: tabular-nums;
      }
      .kpi-card .kpi-rate {
        color: #b9ff9e;
      }
      .kpi-card .kpi-total {
        color: #ffd27a;
      }

    </style>
  </head>
  <body>

    <div id="info">
      마우스: 클릭 화면 선택·좌표 확인 | 왼쪽 드래그 회전 | 오른쪽 드래그(Shift+왼쪽) 이동 | 휠 확대·축소 — 키보드: WASD 이동 | Q,E 상승·하강 | 방향키 회전 | Z,X 확대·축소 | F 전체 화면·C 좌표·V 데이터·H 조작법·K KPI·R ACTION
    </div>

    <a id="customerService" href="https://helpu.kr/ycgroup2022" target="_blank" rel="noopener noreferrer">- Customer Service</a>

    <div id="toggles">
      <button type="button" class="toggle-row" role="switch" aria-checked="false" id="toggleOverview" title="단축키 F">전체 화면<kbd>F</kbd></button>
      <button type="button" class="toggle-row on" role="switch" aria-checked="true" id="toggleCoords" title="단축키 C">좌표<kbd>C</kbd></button>
      <button type="button" class="toggle-row on" role="switch" aria-checked="true" id="toggleSignals" title="단축키 V">데이터<kbd>V</kbd></button>
      <button type="button" class="toggle-row on" role="switch" aria-checked="true" id="toggleHelp" title="단축키 H">조작법<kbd>H</kbd></button>
      <button type="button" class="toggle-row on" role="switch" aria-checked="true" id="toggleKpi" title="단축키 K">KPI<kbd>K</kbd></button>
      <button type="button" class="toggle-row" role="switch" aria-checked="false" id="toggleAction" title="단축키 R">ACTION<kbd>R</kbd></button>
    </div>

    <div id="viewGrid"></div>

    <div id="coords"></div>

    <script type="module" src="/main.js"></script>
  </body>
</html>

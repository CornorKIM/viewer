<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <title>건축 3D 뷰어</title>
    <style>
      body { margin: 0; overflow: hidden; }
      canvas { display: block; }

      #info {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.6);
        color: white;
        padding: 10px 20px;
        border-radius: 8px;
        font-family: sans-serif;
        font-size: 14px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>

    <div id="info">
      화면 클릭 후 → WASD 이동 | Space 점프 | 마우스 시점 조절
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>

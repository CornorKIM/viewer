<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그 전송 이력</title>
  <style>
    :root { --bg: #2e3236; --panel: rgba(0,0,0,0.35); --fg: #f2f2f2; --muted: rgba(255,255,255,0.6); --line: rgba(255,255,255,0.15); --ok: #b9ff9e; --warn: #ffd27a; --err: #ff8f8f; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 sans-serif; }
    main { max-width: 1200px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.sub { margin: 0 0 14px; color: var(--muted); }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
    select, button { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font: inherit; }
    button { cursor: pointer; }
    h2 { font-size: 14px; margin: 18px 0 6px; color: var(--warn); font-weight: normal; }
    .scroll { overflow-x: auto; background: var(--panel); border-radius: 8px; }
    table { border-collapse: collapse; width: 100%; white-space: nowrap; }
    th, td { padding: 5px 10px; border-bottom: 1px solid var(--line); text-align: left; }
    th { color: var(--muted); font-weight: normal; position: sticky; top: 0; background: #34393e; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .ok { color: var(--ok); } .test { color: var(--warn); } .err { color: var(--err); }
    .empty { padding: 14px; color: var(--muted); }
    .legend { color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>
<main>
  <h1>스마트공장 로그 전송 이력</h1>
  <p class="sub">사업관리시스템으로 보낸 로그와 돌아온 결과. AP1002 = 정상 저장, AP1028 = 테스트 확인(미저장), AP1029 = 10분 이내 재전송(미저장).</p>
  <div class="bar">
    <label>기간 <select id="days"><option value="1">오늘</option><option value="7" selected>7일</option><option value="30">30일</option><option value="90">90일</option></select></label>
    <label>업체 <select id="set"><option value="">전체</option><option value="A">목공소 봄</option><option value="B">이레공방</option><option value="C">브랜드스미스</option><option value="D">비스트럭처</option></select></label>
    <button id="reload" type="button">새로고침</button>
    <span id="status" class="legend"></span>
  </div>

  <h2>날짜·업체별 요약</h2>
  <div class="scroll"><table id="summary"></table></div>

  <h2>전송 이력(최신순, 최대 500건)</h2>
  <div class="scroll"><table id="rows"></table></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  function cell(tr, text, cls) { const td = document.createElement('td'); td.textContent = text ?? ''; if (cls) td.className = cls; tr.appendChild(td); }
  function head(table, cols) { const tr = table.createTHead().insertRow(); cols.forEach((c) => { const th = document.createElement('th'); th.textContent = c; tr.appendChild(th); }); }
  const codeClass = (code, err) => err ? 'err' : code === 'AP1002' ? 'ok' : (code === 'AP1028' || code === 'AP1029') ? 'test' : 'err';

  async function load() {
    $('status').textContent = '불러오는 중…';
    try {
      const qs = new URLSearchParams({ days: $('days').value });
      if ($('set').value) qs.set('set', $('set').value);
      const res = await fetch('/api/sf-log-history?' + qs, { cache: 'no-store' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || data.error || res.status);

      const s = $('summary'); s.replaceChildren(); head(s, ['날짜', '업체', '전송', '정상 저장(AP1002)', '테스트', '마지막 결과', '마지막 전송']);
      const sb = s.createTBody();
      if (!data.summary.length) { const tr = sb.insertRow(); const td = tr.insertCell(); td.colSpan = 7; td.className = 'empty'; td.textContent = '기록 없음'; }
      data.summary.forEach((r) => { const tr = sb.insertRow(); cell(tr, r.day); cell(tr, r.name); cell(tr, r.sent, 'num'); cell(tr, r.ok, 'num ok'); cell(tr, r.tests, 'num'); cell(tr, r.last_code || '-', codeClass(r.last_code)); cell(tr, r.last_at); });

      const t = $('rows'); t.replaceChildren(); head(t, ['보낸 시각', '업체', '구분', '사용 구분', '장비', '데이터(Byte)', '결과', '설명', '수신 시각', '오류']);
      const tb = t.createTBody();
      if (!data.rows.length) { const tr = tb.insertRow(); const td = tr.insertCell(); td.colSpan = 10; td.className = 'empty'; td.textContent = '기록 없음'; }
      data.rows.forEach((r) => {
        const tr = tb.insertRow();
        cell(tr, r.sent_at_kst); cell(tr, r.name); cell(tr, r.test ? '테스트' : '실제', r.test ? 'test' : '');
        cell(tr, r.use_se); cell(tr, r.sys_user); cell(tr, r.data_usgqty.toLocaleString(), 'num');
        cell(tr, r.result_code || '-', codeClass(r.result_code, r.error)); cell(tr, r.result_msg); cell(tr, r.recptn_dt); cell(tr, r.error, 'err');
      });
      $('status').textContent = `갱신 ${new Date().toLocaleTimeString('ko-KR')}`;
    } catch (err) {
      $('status').textContent = '불러오기 실패: ' + err.message;
    }
  }
  $('reload').addEventListener('click', load);
  $('days').addEventListener('change', load);
  $('set').addEventListener('change', load);
  load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그 전송 이력</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root { --bg: #2e3236; --panel: rgba(0,0,0,0.35); --fg: #f2f2f2; --muted: rgba(255,255,255,0.6); --line: rgba(255,255,255,0.15); --ok: #b9ff9e; --warn: #ffd27a; --err: #ff8f8f; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 sans-serif; }
    main { max-width: 1200px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.sub { margin: 0 0 14px; color: var(--muted); }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
    select, button { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font: inherit; }
    button { cursor: pointer; }
    h2 { font-size: 14px; margin: 18px 0 6px; color: var(--warn); font-weight: normal; }
    .scroll { overflow-x: auto; background: var(--panel); border-radius: 8px; }
    table { border-collapse: collapse; width: 100%; white-space: nowrap; }
    th, td { padding: 5px 10px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); text-align: center; }
    th:last-child, td:last-child { border-right: none; }
    th { color: var(--muted); font-weight: normal; position: sticky; top: 0; background: #34393e; }
    td.num { font-variant-numeric: tabular-nums; }
    .ok { color: var(--ok); } .test { color: var(--warn); } .info { color: #9ecbff; } .err { color: var(--err); }
    tr.row-err td { background: rgba(255,90,90,0.10); }
    .alert { margin: 0 0 12px; padding: 8px 12px; border-radius: 8px; background: rgba(255,90,90,0.18); border: 1px solid rgba(255,120,120,0.5); color: #ffd6d6; }
    .alert.good { background: rgba(120,220,120,0.12); border-color: rgba(150,230,150,0.4); color: #d8ffd0; }
    .hidden { display: none; }
    td.wrap { white-space: normal; min-width: 180px; }
    .empty { padding: 14px; color: var(--muted); }
    .legend { color: var(--muted); margin-top: 8px; }
    button.toggle { margin-top: 18px; color: var(--warn); }
    button.toggle[aria-expanded="true"] .arrow { display: inline-block; transform: rotate(180deg); }
  </style>
</head>
<body>
<main>
  <h1>스마트공장 로그 전송 이력</h1>
  <p class="sub">스마트공장 사업관리시스템 API 연동</p>
  <div class="bar">
    <label>기간 <select id="days"><option value="1">오늘</option><option value="7" selected>7일</option><option value="30">30일</option><option value="90">90일</option></select></label>
    <label>업체 <select id="set"><option value="">전체</option><option value="A">목공소 봄</option><option value="B">이레공방</option><option value="C">브랜드스미스</option><option value="D">비스트럭처</option><option value="CDR">(주)CDR시스템</option></select></label>
    <button id="reload" type="button">새로고침</button>
    <span id="status" class="legend"></span>
  </div>

  <div id="alert" class="alert hidden"></div>

  <h2>전송 현황</h2>
  <div class="scroll"><table id="summary"></table></div>

  <h2>전송 이력</h2>
  <div class="scroll"><table id="rows"></table></div>

  <button id="codesToggle" class="toggle" type="button" aria-expanded="false" aria-controls="codesPanel">결과 코드 설명(연동규격서 v1.7) <span class="arrow">▾</span></button>
  <div id="codesPanel" class="hidden">
    <p class="legend">결과 색: <span class="ok">정상 저장</span> · <span class="test">테스트</span> · <span class="info">수신만(정상 범위)</span> · <span class="err">오류(조치 필요)</span></p>
    <div class="scroll"><table id="codes"></table></div>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  function cell(tr, text, cls) { const td = document.createElement('td'); td.textContent = text ?? ''; if (cls) td.className = cls; tr.appendChild(td); }
  function head(table, cols) { const tr = table.createTHead().insertRow(); cols.forEach((c) => { const th = document.createElement('th'); th.textContent = c; tr.appendChild(th); }); }
  const LEVEL_CLASS = { ok: 'ok', test: 'test', info: 'info', error: 'err' };
  const LEVEL_NAME = { ok: '정상 저장', test: '테스트', info: '수신만', error: '오류' };
  const empty = (body, cols) => { const tr = body.insertRow(); const td = tr.insertCell(); td.colSpan = cols; td.className = 'empty'; td.textContent = '기록 없음'; };

  async function load() {
    $('status').textContent = '불러오는 중…';
    try {
      const qs = new URLSearchParams({ days: $('days').value });
      if ($('set').value) qs.set('set', $('set').value);
      const res = await fetch('/api/sf-log-history?' + qs, { cache: 'no-store' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || data.error || res.status);

      const errors = data.summary.reduce((n, r) => n + r.errors, 0);
      const alert = $('alert');
      alert.classList.toggle('hidden', !data.summary.length);
      alert.classList.toggle('good', errors === 0);
      alert.textContent = errors
        ? `오류 ${errors}건 — 아래 빨간 행의 의미와 조치를 확인하세요.`
        : '선택한 기간에 오류 없음.';

      const s = $('summary'); s.replaceChildren(); head(s, ['날짜', '업체', '전송', '정상 저장(AP1002)', '테스트', '오류', '마지막 결과', '의미', '마지막 전송']);
      const sb = s.createTBody();
      if (!data.summary.length) empty(sb, 9);
      data.summary.forEach((r) => {
        const tr = sb.insertRow(); if (r.errors) tr.className = 'row-err';
        cell(tr, r.day); cell(tr, r.name); cell(tr, r.sent, 'num'); cell(tr, r.ok, 'num ok'); cell(tr, r.tests, 'num');
        cell(tr, r.errors, r.errors ? 'num err' : 'num'); cell(tr, r.last.code, LEVEL_CLASS[r.last.level]); cell(tr, r.last.meaning, 'wrap'); cell(tr, r.last_at);
      });

      const t = $('rows'); t.replaceChildren(); head(t, ['보낸 시각', '업체', '구분', '사용 구분', '장비', '데이터(Byte)', '결과', '의미', '수신 시각']);
      const tb = t.createTBody();
      if (!data.rows.length) empty(tb, 9);
      data.rows.forEach((r) => {
        const tr = tb.insertRow(); if (r.level === 'error') tr.className = 'row-err';
        cell(tr, r.sent_at_kst); cell(tr, r.name); cell(tr, r.test ? '테스트' : '실제', r.test ? 'test' : '');
        cell(tr, r.use_se); cell(tr, r.sys_user); cell(tr, r.data_usgqty.toLocaleString(), 'num');
        cell(tr, r.code || r.error || '-', LEVEL_CLASS[r.level]); cell(tr, r.meaning, 'wrap'); cell(tr, r.recptn_dt);
      });

      const c = $('codes'); c.replaceChildren(); head(c, ['코드', '구분', '의미', '조치']);
      const cb = c.createTBody();
      data.codes.forEach((r) => {
        const tr = cb.insertRow();
        cell(tr, r.code, LEVEL_CLASS[r.level]); cell(tr, LEVEL_NAME[r.level], LEVEL_CLASS[r.level]); cell(tr, r.meaning, 'wrap'); cell(tr, r.action || '-', 'wrap');
      });
      $('status').textContent = `갱신 ${new Date().toLocaleTimeString('ko-KR')}`;
    } catch (err) {
      $('status').textContent = '불러오기 실패: ' + err.message;
    }
  }
  $('codesToggle').addEventListener('click', () => {
    const open = $('codesPanel').classList.toggle('hidden') === false;
    $('codesToggle').setAttribute('aria-expanded', String(open));
  });
  $('reload').addEventListener('click', load);
  $('days').addEventListener('change', load);
  $('set').addEventListener('change', load);
  load();
</script>
</body>
</html>

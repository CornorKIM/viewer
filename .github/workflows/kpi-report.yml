name: KPI daily report

# 평일 16:00~19:50 KST(07:00~10:50 UTC)에 10분마다 KPI 보고 API 호출.
# API가 그날 마지막 업체의 도달 시각이 지났을 때만 메일을 보내고, 같은 날은 1통만 보냄.
on:
  schedule:
    - cron: '*/10 7-10 * * 1-5'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call KPI report API
        run: |
          code=$(curl -s -o body.json -w '%{http_code}' --max-time 60 "https://viewer-five-beta.vercel.app/api/kpi-report")
          cat body.json; echo
          test "$code" -lt 400
